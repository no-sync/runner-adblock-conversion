name: Build Adblock Blacklist

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup sing-box
        run: |
          SING_BOX_VERSION="1.14.0"

          curl -L \
            -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"

          tar -xzf sing-box.tar.gz

          sudo install \
            "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Build blacklist
        run: python build.py

      - name: Commit output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add output/

          git diff --cached --quiet || (
            git commit -m "Update blacklist"
            git push
          )

      - name: Keepalive
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
